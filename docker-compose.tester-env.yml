services:
  php-fpm:
    build:
      context: .
      dockerfile: Dockerfile.tester-env
      target: php-fpm
    image: ${IMAGE_TAG:-tester-env-plainpad:dev}
    network_mode: bridge
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "19000:9000"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 13306
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-m"]
      interval: 2s
      timeout: 5s
      retries: 10

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.tester-env
      target: nginx
    image: ${NGINX_IMAGE:-tester-env-plainpad:dev-nginx}
    network_mode: bridge
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      php-fpm:
        condition: service_healthy
    ports:
      - "${PLAINPAD_PORT:-8098}:80"

  mysql:
    image: mysql:8.0
    network_mode: bridge
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: plainpad
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
